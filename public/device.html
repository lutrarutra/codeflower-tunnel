<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Approve a connector</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/device.js"></script>
  </head>
  <body>
    <main>
      <header>
        <img src="/icon.svg" alt="" />
        <h1>Approve a connector</h1>
      </header>

      <section id="error" class="error" role="alert" hidden></section>

      <section id="sign-in" hidden>
        <p>Sign in first, then you come back here.</p>
        <a class="button" href="/">Sign in</a>
      </section>

      <section id="details" hidden>
        <p>A machine asks to connect to your account:</p>
        <p class="code" id="code"></p>
        <ul class="list">
          <li><span>Name</span><strong id="name"></strong></li>
          <li><span>Route</span><strong id="region"></strong></li>
          <li><span>Key fingerprint</span><code id="fingerprint"></code></li>
        </ul>
        <p class="muted gap-top">Approve only if the code and fingerprint match what <code>codeflower tunnel login</code> printed.</p>
        <div class="row">
          <button class="primary" id="approve">Approve</button>
          <button class="danger" id="deny">Deny</button>
        </div>
      </section>

      <section id="done" hidden>
        <p id="done-text"></p>
        <a class="button" href="/">Your account</a>
      </section>
    </main>
  </body>
</html>
